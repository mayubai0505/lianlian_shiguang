name: lianlian_shiguang
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+29

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_ai: any
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  screenshot: ^3.0.0
  flutter_colorpicker: ^1.1.0  # ✨ 加入這一行
  shared_preferences: ^2.2.3
  flutter_staggered_grid_view: ^0.7.0  # 🌟 加入這一行
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  image_cropper: ^12.1.1
  share_plus: ^13.1.0 # 或最新版本
  google_fonts: ^8.0.2
  firebase_core: ^4.10.0 # 用來播放試聽檔
  firebase_app_check: ^0.4.1+5
  cloud_firestore: ^6.5.0
  cloud_functions: ^6.0.7
  firebase_auth: ^6.5.2
  cached_network_image: ^3.3.1
  js: ^0.7.1
  permission_handler: ^12.0.1
  flutter_sound: ^9.2.13
  path_provider: ^2.1.3
  card_swiper: ^3.0.1
  firebase_storage: ^13.1.0
  http: ^1.4.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  provider: ^6.1.5
  table_calendar: ^3.1.1
  in_app_purchase: ^3.2.0
  timezone: ^0.11.0  # <-- 加入 timezone
  flutter_facebook_auth: ^7.1.6
  sign_in_with_apple: ^8.0.0
  speech_to_text: ^7.4.0
  firebase_messaging: ^16.1.3
  flutter_native_splash: ^2.4.7
  video_player: ^2.10.1
  web: ^1.1.1
  flutter_timezone: ^5.0.2
  flutter_local_notifications: ^21.0.0
  audioplayers: ^6.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/animations/butterfly_splash.mp4
    - assets/images/
    - assets/images/google_logo.png
    - assets/images/flower_gift.png
    - assets/images/flower_gift_dark.png
    - assets/images/blank_avatar.png
    - assets/images/moment_outline.png
    - assets/images/avatar1.png
    - assets/images/avatar2.png
    - assets/images/avatar3.png
    - assets/images/avatar4.png
    - assets/images/avatar5.png
    - assets/images/avatar6.png
    - assets/images/avatar7.png
    - assets/images/avatar8.png
    - assets/images/avatar9.png
    - assets/images/avatar10.png
    - assets/images/avatar11.png
    - assets/images/avatar12.png
    - assets/images/avatar13.png
    - assets/images/logo.jpg
    - assets/images/chat_icon.png
    - assets/images/select_chat_icon.png
    - assets/images/profile_icon.png
    - assets/images/my_cute_phone_icon.png
    - assets/audio/pickup.mp3
    - assets/images/splash_bg_only.png
    - assets/images/butterfly_transparent.png
  fonts:
    - family: NotoSansTC
      fonts:
      - asset: assets/fonts/NotoSansTC-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true # 這是對的！避免 Apple 因為透明圖層退件
  image_path: "assets/images/logo.jpg" # 這裡統一用妳清單裡的 logo.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"

flutter_native_splash:

  # ✨ 1. 背景：放「純漸層（沒有蝴蝶）」的圖
  background_image: "assets/images/splash_bg_only.png"

  # ✨ 2. 前景 Logo：放「透明去背」的手繪蝴蝶
  image: "assets/images/butterfly_transparent.png"

  # 📱 確保雙平台都有開啟替換
  android: true
  ios: true

  # Android 12+ 專屬設定保持妳原本的聰明做法即可
  android_12:
    color: "#E3CAFE"
    image: "assets/images/butterfly_transparent.png"